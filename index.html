<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BTC Range Chart · Kraken</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Ctext x='5' y='24' font-size='24' fill='%23f59e0b'%3E%E2%82%BF%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div class="identity">
      <span class="btc">₿</span>
      <strong>BTCUSD Multi Collateral Perpetual</strong>
      <span class="venue">Kraken</span>
      <span id="status" class="status">CONECTANDO</span>
    </div>
    <div id="ohlc" class="ohlc">Esperando datos...</div>
    <div class="controls">
      <label>Rango
        <select id="range">
          <option value="25">25 USD</option>
          <option value="50" selected>50 USD</option>
          <option value="100">100 USD</option>
          <option value="250">250 USD</option>
        </select>
      </label>
      <label>Alertas
        <select id="alert-mode">
          <option value="live">En vivo</option>
          <option value="closed" selected>Al cierre</option>
        </select>
      </label>
      <button id="reset-zoom" type="button">30 velas</button>
    </div>
  </header>
  <main id="chart"></main>
  <footer>
    <span>RVOL ≥ 3.5x · Relative Delta ±3.5x · SRSI 14/14/3/3 · Weis ATR 14</span>
    <span id="connection">Conectando con Kraken...</span>
  </footer>
  <script src="/vendor/echarts.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
